<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Resource Upload</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070b12;color:#eef4fb;font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:0 auto;padding:48px 22px}.card{border:1px solid #202a38;background:#0b111b;border-radius:16px;padding:24px}h1{margin:0 0 8px;font-size:26px}p{margin:0 0 18px;color:#98a6b8}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{appearance:none;border:1px solid #2a3647;background:#111a27;color:#eef4fb;border-radius:10px;padding:11px 14px;font:600 14px inherit;cursor:pointer}.btn.primary{background:#e8f2ff;color:#07111f;border-color:#e8f2ff}.btn:disabled{opacity:.45;cursor:not-allowed}input[type=file]{display:none}.stat{margin-top:18px;padding:14px;border:1px solid #202a38;border-radius:12px;background:#080d15}.bar{height:8px;background:#131c29;border-radius:999px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#dcecff;transition:width .12s linear}.row{display:flex;justify-content:space-between;gap:14px}.muted{color:#7e8da1}.log{margin-top:14px;max-height:280px;overflow:auto;border-top:1px solid #202a38;padding-top:12px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#91a0b4}.ok{color:#a9e2ba}.bad{color:#ffaaa6}.warn{color:#ffd88a}.hidden{display:none}.note{font-size:13px;color:#8493a6;margin-top:14px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Upload resource folder</h1>
<p>Select the extracted parent folder that contains <b>Ext 1</b>, <b>Ext 2</b> and <b>RHHS</b>. The folder structure will be preserved in Supabase.</p>
<div id="authBox" class="stat">Checking sign-in...</div>
<div id="uploader" class="hidden">
  <div class="actions">
    <label class="btn primary" for="folderInput">Choose folder</label>
    <input id="folderInput" type="file" webkitdirectory directory multiple>
    <button id="startBtn" class="btn" type="button" disabled>Start upload</button>
  </div>
  <div id="selection" class="note">No folder selected.</div>
  <div class="stat">
    <div class="row"><strong id="status">Ready</strong><span id="count" class="muted">0 / 0</span></div>
    <div class="bar"><div id="fill" class="fill"></div></div>
  </div>
  <div id="log" class="log"></div>
</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-client.js"></script>
<script>
(async()=>{
  const authBox=document.getElementById('authBox'), uploader=document.getElementById('uploader');
  const input=document.getElementById('folderInput'), start=document.getElementById('startBtn');
  const selection=document.getElementById('selection'), status=document.getElementById('status');
  const count=document.getElementById('count'), fill=document.getElementById('fill'), log=document.getElementById('log');
  let files=[];
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const add=(text,cls='')=>{const d=document.createElement('div');d.className=cls;d.innerHTML=esc(text);log.prepend(d)};
  function cleanPath(p){return p.split('/').filter(Boolean).map(s=>s.replace(/\\/g,'-')).join('/')}
  function mappedPath(f,all){
    const parts=f.webkitRelativePath.split('/').filter(Boolean);
    const first=parts[0];
    const sameRoot=all.every(x=>x.webkitRelativePath.split('/').filter(Boolean)[0]===first);
    const topSet=new Set(all.map(x=>x.webkitRelativePath.split('/').filter(Boolean)[1]).filter(Boolean));
    const looksLikeParent=sameRoot && [...topSet].some(x=>/^(Ext 1|Ext 2|RHHS)$/i.test(x));
    return cleanPath((looksLikeParent?parts.slice(1):parts).join('/'));
  }
  try{
    const init=await window.HSCAuth.init();
    if(!init.configured) throw new Error('Supabase auth is not configured.');
    const session=await window.HSCAuth.getSession();
    if(!session){
      authBox.innerHTML='You need to sign in first. <a href="/login/?next=/upload/" style="color:#dcecff">Sign in</a>, then return to this page.';
      return;
    }
    authBox.textContent='Signed in. Ready to upload.';
    uploader.classList.remove('hidden');
  }catch(e){authBox.textContent='Could not initialise uploader: '+e.message;return}

  input.addEventListener('change',()=>{
    files=[...input.files].filter(f=>!/(^|\/)\.DS_Store$|Thumbs\.db$/i.test(f.webkitRelativePath||f.name));
    const total=files.reduce((a,f)=>a+f.size,0);
    selection.textContent=files.length?`${files.length.toLocaleString()} files selected · ${(total/1024/1024).toFixed(1)} MB`:'No folder selected.';
    start.disabled=!files.length;
    status.textContent='Ready'; count.textContent=`0 / ${files.length}`; fill.style.width='0%'; log.replaceChildren();
  });

  start.addEventListener('click',async()=>{
    if(!files.length)return;
    start.disabled=true; input.disabled=true; status.textContent='Uploading…';
    const client=window.HSCAuth.client; let next=0,done=0,failed=0; const failures=[]; const concurrency=4;
    const update=()=>{count.textContent=`${done} / ${files.length}`;fill.style.width=`${Math.round(done/files.length*100)}%`};
    async function worker(){
      while(true){
        const i=next++; if(i>=files.length)return;
        const file=files[i], path=mappedPath(file,files);
        try{
          const {error}=await client.storage.from('resources').upload(path,file,{upsert:true,cacheControl:'31536000',contentType:file.type||undefined});
          if(error)throw error;
          add('✓ '+path,'ok');
        }catch(e){failed++;failures.push({path,error:e.message});add('✗ '+path+' — '+e.message,'bad')}
        done++;update();
      }
    }
    await Promise.all(Array.from({length:Math.min(concurrency,files.length)},worker));
    status.textContent=failed?`Finished with ${failed} failed`:'Upload complete';
    if(failed)add(`${failed} files failed. You can run the same folder again; successful files will be overwritten and failed files retried.`,'warn');
    else add('All files uploaded successfully.','ok');
    start.disabled=false; input.disabled=false;
  });
})();
</script>
</body>
</html>
