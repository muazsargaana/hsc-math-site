<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSC Maths Archive</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page-shell">
    <aside class="filter-panel" id="filter-panel">
      <div class="filter-head">
        <div>
          <div class="filter-kicker">3U / 4U</div>
          <h2>Filter</h2>
        </div>
        <button id="reset-filters" class="text-button" type="button">Reset</button>
      </div>

      <div id="filter-groups"></div>
    </aside>

    <main class="content">
      <header class="page-header">
        <h1>HSC Maths Archive</h1>
      </header>

      <div class="search-row">
        <input
          id="search"
          type="search"
          placeholder="Search papers, schools, topics..."
          autocomplete="off"
        >
        <span id="result-count" class="result-count"></span>
      </div>

      <div id="resource-tree"></div>
    </main>
  </div>

  <script src="resources.js"></script>
  <script src="script.js"></script>
</body>
</html>
