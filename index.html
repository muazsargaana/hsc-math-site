<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b12">
  <meta name="description" content="NSW HSC Mathematics Extension resources in a simple searchable library.">
  <title>HSC Maths Resources</title>
  <script src="dark-lock.js"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="drive-browser.css">
  <link rel="stylesheet" href="minimal-home.css">
</head>
<body>
  <main class="content-shell">
    <nav class="top-dock" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="HSC Maths Resources home">
        <img src="/favicon.svg" alt="" width="18" height="18">
        <span>HSC Maths</span>
      </a>
      <a class="nav-account-link" href="/profile/">Account</a>
    </nav>

    <header class="page-header">
      <h1>HSC Maths Resources</h1>
      <p>Extension 1, Extension 2 and RHHS resources.</p>
    </header>

    <section id="resources" class="drive-explorer" aria-label="Resource library">
      <div class="drive-bar">
        <button id="drive-back" class="drive-nav-btn" type="button" aria-label="Go back"><span class="drive-nav-icon back"></span></button>
        <button id="drive-home" class="drive-nav-btn" type="button" aria-label="Go to root"><span class="drive-nav-icon home"></span></button>
        <div id="drive-crumbs" class="drive-crumbs" aria-label="Folder path"></div>
        <div class="drive-search"><input id="drive-search" type="search" placeholder="Search this folder" autocomplete="off" aria-label="Search current folder"></div>
      </div>
      <div class="drive-head">
        <div><h2 id="drive-title">Resources</h2><p id="drive-subtitle">Loading...</p></div>
      </div>
      <div class="drive-columns"><span>Name</span><span>Type</span></div>
      <div id="drive-list" class="drive-list"><div class="drive-loading">Loading library...</div></div>
    </section>
  </main>

  <script src="resource-paths.js"></script>
  <script src="drive-browser.js"></script>
</body>
</html>
