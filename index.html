<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSC Extension Maths Resources</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="top-rule"></div>

  <main class="content-shell">
    <header class="page-header">
      <div class="header-row">
        <div>
          <h1>HSC Extension Maths Resources</h1>
          <p class="subtitle">NSW HSC Mathematics · Extension 1 &amp; Extension 2</p>
        </div>

        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch colour theme">
          <span class="theme-icon" aria-hidden="true"></span>
          <span class="theme-label">Light</span>
        </button>
      </div>
    </header>

    <div class="control-bar">
      <div class="quick-filter" aria-label="Course filter">
        <span class="control-label">Course</span>
        <div id="course-filter" class="segmented"></div>
      </div>

      <div class="quick-filter" aria-label="Resource type filter">
        <span class="control-label">Show</span>
        <div id="type-filter" class="segmented"></div>
      </div>

      <div id="source-filter-wrap" class="quick-filter source-filter-wrap hidden-control">
        <label class="control-label" for="source-filter">Source</label>
        <select id="source-filter"></select>
      </div>

      <button id="clear-view" class="clear-view hidden-control" type="button">Clear view</button>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-mark">⌕</span>
        <input
          id="search"
          type="search"
          placeholder="Search papers, schools, topics"
          autocomplete="off"
        >
      </div>
      <span id="result-count" class="result-count"></span>
    </div>

    <div id="resource-tree"></div>
  </main>

  <script src="resources.js"></script>
  <script src="script.js"></script>
</body>
</html>
