<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSC Maths Archive</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="top-rule"></div>

  <div class="page-shell">
    <aside class="filter-panel" id="filter-panel">
      <div class="filter-head">
        <div class="filter-title-row">
          <span class="filter-kicker">FILTERS</span>
          <span id="active-filter-count" class="active-filter-count"></span>
        </div>
        <div class="filter-actions">
          <button id="reset-filters" class="text-button" type="button">reset</button>
          <button id="collapse-filters" class="icon-button" type="button" aria-label="Collapse filters" title="Collapse filters">‹</button>
        </div>
      </div>

      <div id="filter-groups"></div>
    </aside>

    <button id="show-filters" class="show-filters hidden-control" type="button">Filters</button>

    <main class="content">
      <header class="page-header">
        <div class="eyebrow">NSW HSC · 3U + 4U</div>
        <div class="title-line">
          <h1>Maths Archive</h1>
          <span class="archive-mark">/</span>
        </div>
      </header>

      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-mark">⌕</span>
          <input
            id="search"
            type="search"
            placeholder="Search papers, schools, topics"
            autocomplete="off"
          >
        </div>
        <span id="result-count" class="result-count"></span>
      </div>

      <div id="resource-tree"></div>
    </main>
  </div>

  <script src="resources.js"></script>
  <script src="script.js"></script>
</body>
</html>
